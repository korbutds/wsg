name: Release

# A merge into main opens or updates the release pull request; merging that one tags the release
# and publishes to npm. The npm trusted publisher is bound to this file name: keep it.
# Run it by hand with a tag (Actions -> Release -> Run workflow) to publish a release that is tagged
# but not on npm, e.g. when release-please failed after creating the tag.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish to npm, e.g. v0.9.3
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # always(): on a manual run release-please is skipped, and a skipped need skips this job too.
    if: >-
      always() && (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
        github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      # A manual run names any ref: publish only a release tag whose package.json has that version.
      - name: Check the tag
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ] || ! git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::$TAG is not a release tag of package.json version $version"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC, no token) needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@11
      - run: npm --version
      - run: npm ci
      - run: npm publish --provenance --access public
